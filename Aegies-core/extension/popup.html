<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisCore Guard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 300px;
      background: #0A0C16;
      color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .header span { color: #3B82F6; }
    .status {
      padding: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 12px;
    }
    .status .label { font-size: 11px; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.5px; }
    .status .value { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .safe { color: #22C55E; }
    .warning { color: #F59E0B; }
    .danger { color: #EF4444; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary { background: #3B82F6; color: #fff; }
    .btn-primary:hover { background: #2563EB; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #E5E7EB; border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .footer { margin-top: 16px; text-align: center; font-size: 10px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="header">
    <div style="width:32px;height:32px;background:rgba(59,130,246,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;">🛡</div>
    <h1>AEGIS<span>CORE</span></h1>
  </div>

  <div class="status">
    <div class="label">Current Page</div>
    <div class="value" id="currentPage">Loading...</div>
  </div>

  <div class="status">
    <div class="label">Risk Assessment</div>
    <div class="value" id="riskStatus">Checking...</div>
  </div>

  <div class="status">
    <div class="label">Quick Actions</div>
    <div class="value" style="margin-top: 8px;">
      <button class="btn btn-primary" id="scanBtn">🔍 Scan Current URL</button>
      <button class="btn btn-secondary" id="dashboardBtn">📊 Open AegisCore Dashboard</button>
    </div>
  </div>

  <div class="footer">
    AegisCore Security Guard v1.0.0 — Real-time phishing & malware protection
  </div>

  <script src="popup.js"></script>
</body>
</html>
